name: Maintenance dashboard

on:
  schedule:
    # Daily, after the Node.js update run. An off-peak minute avoids the
    # top-of-the-hour queue.
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  # Keeps one issue listing due catalog, pnpm, gitleaks, Node.js and audit
  # updates. It never changes code. A called workflow cannot raise the caller's
  # token, so the job grants it here.
  maintenance-dashboard:
    permissions:
      contents: read
      issues: write
    uses: valuecodes/automation/.github/workflows/maintenance-dashboard.yml@3d383603d5ecb82ea0dcb95223ae8f9eab43ca9e # v0.2.0
