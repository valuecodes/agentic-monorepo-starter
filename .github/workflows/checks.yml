name: Checks

# Every check, defined once. `feature.yml` (PRs) and `main.yml` (push to main)
# call it; a called workflow cannot raise the caller's token, so each caller job
# grants the permissions the jobs below ask for.
on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Root package.json script names.
        task: [typecheck, lint, knip, "format:check", test, build]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # `$/` (self-repository syntax) lets the lockfile cover the actions this
      # composite calls; `./` cannot. actionlint 1.7.12 does not know `$/` yet,
      # so `.github/actionlint.yaml` ignores that one error.
      - name: Setup
        uses: $/.github/actions/setup

      # Turbo's local cache, restored from the latest run of the same task so an
      # unchanged package replays instead of rerunning. Only typecheck, test and
      # build go through Turbo; lint, knip and format:check have no `.turbo`.
      - name: Turbo cache
        if: contains(fromJSON('["typecheck", "test", "build"]'), matrix.task)
        uses: actions/cache@v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ matrix.task }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ matrix.task }}-

      # The task name goes through `env`, never straight into `run`.
      - name: Run ${{ matrix.task }}
        env:
          TASK: ${{ matrix.task }}
        run: pnpm "$TASK"

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Full history: gitleaks scans every commit, not just the checked-out tree.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Same script as `pnpm secrets:scan`; runs the pinned gitleaks Docker
      # image, so no pnpm/Node setup is needed.
      - name: Scan for secrets
        run: sh .github/scripts/secrets-scan.sh

  # Verifies `.github/workflows/actions.lock`: every `uses:` has an entry and
  # each locked commit is still reachable from its tag in the action's own
  # repository. The runner repeats the check when a job starts. Rerun
  # `gh actions-lock` after any `uses:` change. The extension version is bumped
  # by hand; the maintenance dashboard does not track it.
  actions-lock:
    name: actions-lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify the workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.0
          gh actions-lock --verify

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # The workflow files are checked by the `workflow-lint` job instead.
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # Advanced setup: turn OFF "default setup" under Settings → Code security,
      # or GitHub rejects these uploads. No build step is needed.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4.38.3
        with:
          category: "/language:${{ matrix.language }}"

  # actionlint (with shellcheck on `run:` scripts) and zizmor over the workflow
  # and action files.
  workflow-lint:
    permissions:
      contents: read
    uses: valuecodes/automation/.github/workflows/workflow-lint.yml@5c8e09f76205c0fa9bb049c52757b845636e76ad # v0.7.0
